name: Publish Extension

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify only; manual dispatch can never publish'
        type: boolean
        default: true
        required: true

concurrency:
  group: publish-extension
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Build and Verify Release Artifacts
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject manual publication mode
        if: github.event_name == 'workflow_dispatch'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" != "true" ]; then
            echo "::error::Manual dispatch is verification-only. Publish through a GitHub Release."
            exit 1
          fi

      - name: Verify Release Commit Is on Main
        if: github.event_name == 'release'
        shell: bash
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Release tag must point to a commit on main."
            exit 1
          }

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Check types and lint
        run: npm run check-types && npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Package VSIX for Verification
        id: package-vsix
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: dry-run
          registryUrl: https://marketplace.visualstudio.com
          dryRun: true

      - name: Verify VSIX Package and Extension Host
        shell: bash
        env:
          VSIX_PATH: ${{ steps.package-vsix.outputs.vsixPath }}
        run: xvfb-run -a node scripts/verify-vsix-package.mjs "$VSIX_PATH"

      - name: Build and Verify npm Artifact
        run: npm run verify:npm-package -- --output-dir "$RUNNER_TEMP/npm-package"

      - name: Stage Release Artifacts
        shell: bash
        env:
          VSIX_PATH: ${{ steps.package-vsix.outputs.vsixPath }}
        run: |
          artifact_dir="$RUNNER_TEMP/release-artifacts"
          mkdir -p "$artifact_dir"
          test -f "$VSIX_PATH"
          cp "$VSIX_PATH" "$artifact_dir/extension.vsix"
          cp "$RUNNER_TEMP/npm-package/"*.tgz "$artifact_dir/"
          cp "$RUNNER_TEMP/npm-package/package-metadata.json" "$artifact_dir/"
          printf '%s\n' "$GITHUB_SHA" > "$artifact_dir/source-commit.txt"
          printf '%s\n' "$GITHUB_REF" > "$artifact_dir/source-ref.txt"

      - name: Upload Verified Release Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: verified-release-artifacts
          path: ${{ runner.temp }}/release-artifacts/
          if-no-files-found: error
          retention-days: 7

  publish-vsix:
    name: Publish Verified VSIX
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Verified Release Artifacts
        uses: actions/download-artifact@v8
        with:
          name: verified-release-artifacts
          path: ${{ runner.temp }}/release-artifacts

      - name: Publish to VS Code Marketplace
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.VSCE_PAT }}
          registryUrl: https://marketplace.visualstudio.com
          extensionFile: ${{ runner.temp }}/release-artifacts/extension.vsix
          skipDuplicate: true

      - name: Publish to Open VSX
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          registryUrl: https://open-vsx.org
          extensionFile: ${{ runner.temp }}/release-artifacts/extension.vsix
          skipDuplicate: true

      - name: Upload VSIX to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: ${{ runner.temp }}/release-artifacts/extension.vsix

  publish-npm:
    name: Publish Verified npm Artifact
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Verified Release Artifacts
        uses: actions/download-artifact@v8
        with:
          name: verified-release-artifacts
          path: ${{ runner.temp }}/release-artifacts

      - name: Setup Node for Trusted Publishing
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install pinned npm CLI without lifecycle scripts
        run: npm install --global --ignore-scripts npm@11.5.1

      - name: Verify npm artifact integrity
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';

          const dir = path.join(process.env.RUNNER_TEMP, 'release-artifacts');
          const metadata = JSON.parse(fs.readFileSync(path.join(dir, 'package-metadata.json'), 'utf8'));
          const tarballs = fs.readdirSync(dir).filter((name) => name.endsWith('.tgz'));
          if (tarballs.length !== 1) throw new Error(`Expected exactly one npm tarball, found ${tarballs.length}`);
          const tarball = path.join(dir, tarballs[0]);
          const integrity = `sha512-${crypto.createHash('sha512').update(fs.readFileSync(tarball)).digest('base64')}`;
          if (metadata.integrity !== integrity) throw new Error('npm tarball integrity does not match build metadata');
          if (metadata.filename !== tarballs[0]) throw new Error('npm tarball filename does not match build metadata');
          console.log(`Verified ${metadata.id} (${integrity})`);
          NODE

      - name: Publish npm artifact with provenance
        run: npm publish "$RUNNER_TEMP"/release-artifacts/*.tgz --provenance --access public
